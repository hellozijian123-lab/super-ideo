<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Congratulations!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0;
      font-family: "Poppins", sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 28px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .card h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .card .subtitle {
      font-size: 14px;
      font-weight: 300;
      color: #999999;
      margin-bottom: 20px;
    }

    .winner-banner {
      background: linear-gradient(90deg, #64b3f4 0%, #4a7fe8 100%);
      border-radius: 12px;
      padding: 18px 0;
      margin-bottom: 24px;
    }

    .winner-banner span {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    .product-image {
      width: 100%;
      max-width: 300px;
      height: 280px;
      object-fit: contain;
      margin: 0 auto 28px;
      display: block;
    }

    .product-placeholder {
      width: 100%;
      max-width: 300px;
      height: 280px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      border: 2px dashed #ddd;
      border-radius: 12px;
      color: #aaa;
      font-size: 14px;
    }

    .cta-button {
      display: inline-block;
      padding: 16px 48px;
      background-color: #d9533f;
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      font-family: "Poppins", sans-serif;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .cta-button:hover {
      background-color: #d4503a;
    }

    .cta-button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CONGRATULATIONS!</h1>
    <p class="subtitle">You could be the next one</p>

    <div class="winner-banner">
      <span>WINNER!</span>
    </div>

    <img class="product-image" src="product.png" alt="Mystery Box Prize" />

    <a href="#" class="cta-button">Start Participating!</a>
  </div>
</body>
</html>
